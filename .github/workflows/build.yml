name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Novadesk Solution (Release x64)
        shell: powershell
        run: |
          .\Build.ps1 -Configuration Release -Platform x64

      - name: Install NSIS
        shell: powershell
        run: |
          $installer = "$env:TEMP\nsis-setup.exe"
          Invoke-WebRequest -Uri "https://github.com/rainmeter/build-tools/releases/download/v1/nsis-3.12-setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
          $nsisDir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) { $nsisDir = "$env:ProgramFiles\NSIS" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir

      - name: Build NSIS Installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "installer\dist_output" -Force | Out-Null
          & makensis.exe installer\setup.nsi

      - name: Upload Binaries (dist)
        uses: actions/upload-artifact@v4
        with:
          name: novadesk-binaries
          path: dist
          if-no-files-found: error

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: novadesk-installer
          path: installer/dist_output/*.exe
          if-no-files-found: error
